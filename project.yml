name: Daytwo
options:
  bundleIdPrefix: com.lcollection
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/MarkdownUI
    from: 2.4.1

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
  configs:
    Debug:
      ENABLE_TESTABILITY: true

targets:
  Daytwo:
    type: application
    platform: macOS
    sources:
      - Daytwo
    dependencies:
      - package: MarkdownUI
    entitlements:
      path: Daytwo/Daytwo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Daytwo/Info.plist
      properties:
        CFBundleDisplayName: Daytwo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocationUsageDescription: "Daytwo 需要获取您的当前位置，为日记记录地点信息。位置数据仅保存在您的设备上，不会上传到任何服务器。"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_NAME: Daytwo
        PRODUCT_BUNDLE_IDENTIFIER: com.lcollection.Daytwo
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DaytwoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DaytwoTests
    dependencies:
      - target: Daytwo
    settings:
      base:
        PRODUCT_NAME: DaytwoTests
        PRODUCT_BUNDLE_IDENTIFIER: com.lcollection.DaytwoTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Daytwo.app/Contents/MacOS/Daytwo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Daytwo:
    build:
      targets:
        Daytwo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DaytwoTests
